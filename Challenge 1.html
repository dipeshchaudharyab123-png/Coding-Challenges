<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge 1</title>

    // Challenge 1: Perfect Centering using Flexbox. The red box should be centered both vertically and horizontally within the blue box.
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .parent {
        width: 500px;
        height: 300px;
        background-color: blue;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .child {
        width: 100px;
        height: 60px;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child"></div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 4</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
        }
        nav{
            display: flex;
            position: fixed;
            top: 0;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #333;
            color: #fff;
        }
        nav h2{
            font-size: 1.5rem;
        }
        nav ul{
            list-style: none;
            display: flex;
            gap: 1rem;
        }
        nav ul li a{
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        nav ul li a:hover{
            color: #ccc;
        }
        .hero{
            text-align: center;
            padding: 4rem 2rem;
            background-color: #f4f4f4;
        }
        .hero h1{
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .hero p{
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .btn{
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover{
            background-color: #555;
        }
        .main{
            padding: 2rem;
        }
        .main h2{
            text-align: center;
            margin-bottom: 2rem;
        }
        .main div{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .product{
            background-color: #f4f4f4;
            padding: 1rem;
            text-align: center;
            border-radius: 5px;
            transition: transform 0.3s;
        }
        .product:hover{
            transform: translateY(-5px);
        }
        footer{
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: #fff;
        }
        @media (max-width: 768px) {
            nav{
                flex-direction: column;
                align-items: flex-start;
                position: relative;
            }
            nav ul{
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <h2>LOGO</h2>
        </div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <section class="hero">
        <h1>Welcome to Our Website</h1>
        <p>Discover our amazing products and services.</p>
        <a href="#" class="btn">Get Started</a>
    </section>

    <section class="main">
        <h2>Our Products</h2>
        <div>
            <div class="product">
                <h3>Product 1</h3>
            </div>
            <div class="product">
                <h3>Product 2</h3>
            </div>
            <div class="product">
                <h3>Product 3</h3>
            </div>
            <div class="product">
                <h3>Product 3</h3>
            </div>
            <div class="product">
                <h3>Product 4</h3>
            </div>
            <div class="product">
                <h3>Product 5</h3>
            </div>
            <div class="product">
                <h3>Product 6</h3>
            </div>
            <div class="product">
                <h3>Product 7</h3>
            </div>
            <div class="product">
                <h3>Product 8</h3>
            </div>
        </div>
    </section>
    <footer>
        <p>&copy; 2024 Our Website. All rights reserved.</p>
    </footer>
</body>
</html>
